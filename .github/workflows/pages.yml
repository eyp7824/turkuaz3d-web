name: Publish Turkuaz 3D site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html 404.html CNAME robots.txt sitemap.xml favicon-96x96.png _site/
          cp -R assets data en hizmetler hizmet blog bolge sayfa iletisim sorular bloglar urunler hata yonetim public 3d-baski 3d-tasarim hizmetlerimiz lletisim _site/
          cp gizlilik.html cerez.html kvkk.html _site/
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
