name: Check Turkuaz 3D SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'hizmetler/**'
      - 'hizmet/**'
      - 'blog/**'
      - 'bloglar/**'
      - 'bolge/**'
      - 'sayfa/**'
      - 'iletisim/**'
      - 'sorular/**'
      - 'urunler/**'
      - 'hata/**'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'tools/seo-check.mjs'
      - 'tools/check-legacy-urls.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/check-seo.yml'
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all public SEO metadata
        run: node tools/seo-check.mjs
      - name: Verify old hosting URLs point to existing pages
        run: node tools/check-legacy-urls.mjs
