name: Build Turkuaz 3D Web APK and Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Turkuaz-3D-Web-Android-DEBUG-uninstall-required
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Unlike Gradle's debug certificate, this signing seed produces the same
      # certificate in every build. Never commit or print ANDROID_SIGNING_SEED.
      - name: Check whether stable Android signing is configured
        id: signing
        shell: bash
        env:
          SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          if [ ${#SIGNING_SEED} -ge 32 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signed update APK skipped: add GitHub Actions secret ANDROID_SIGNING_SEED (min 32 chars).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate stable Android release signing identity
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          python -m pip install 'cryptography>=46,<47'
          python apps/android/tools/generate_release_signing.py
      - name: Build consistently signed Android release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Turkuaz-3D-Web-Android-SIGNED-v1.0.10-UPDATABLE
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create branded EXE icon from website logo
        shell: pwsh
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; im=Image.open('favicon-96x96.png').convert('RGBA'); im.save('apps/windows/turkuaz3d.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])"
      - name: Build Windows executable
        shell: pwsh
        run: dotnet publish apps/windows/Turkuaz3DWeb.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o apps/windows/dist
      - uses: actions/upload-artifact@v4
        with:
          name: Turkuaz-3D-Web-Windows
          path: |
            apps/windows/dist/Turkuaz3DWeb.exe
            apps/windows/dist/*.dll
            apps/windows/dist/*.json
          if-no-files-found: error
