name: Check Android viewport layout
on:
  push:
    branches: [main]
    paths:
      - tools/mobile-check.mjs
      - .github/workflows/check-mobile-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save playwright-core@1.56.1
      - name: Test all phone screen sizes
        run: node tools/mobile-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Turkuaz-Mobile-Viewport-Screenshots
          path: mobile-test-shots/
          if-no-files-found: ignore
