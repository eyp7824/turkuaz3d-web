plugins { id 'com.android.application' }
android {
    namespace 'com.turkuaz3d.web'
    compileSdk 35
    defaultConfig {
        applicationId 'com.turkuaz3d.web'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.10'
    }
    signingConfigs {
        stableRelease {
            storeFile file('release-signing.p12')
            storeType 'pkcs12'
            storePassword System.getenv('ANDROID_SIGNING_PASSWORD') ?: 'not-configured'
            keyAlias 'turkuaz3d'
            keyPassword System.getenv('ANDROID_SIGNING_PASSWORD') ?: 'not-configured'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'androidx.webkit:webkit:1.12.1'
}
