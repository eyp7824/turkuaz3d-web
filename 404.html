<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<script>
/* Recovery for URLs retained from the previous hosting provider.
   Static GitHub Pages cannot issue HTTP 301 redirects: this is a
   visitor-friendly fallback for legacy URLs that were not recreated. */
(function () {
  var path;
  try {path=decodeURIComponent(location.pathname).toLocaleLowerCase('tr-TR');}
  catch(e){path=location.pathname.toLowerCase();}
  path=path.replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c');
  var target='';
  if(/^\/(hizmet|hizmetler|blog|bolge|sayfa)\//.test(path)){
    if(/(seri.uretim|eklemeli.imalat)/.test(path)){
      target='/hizmetler/seri-uretim-3d-baski/';
    }else if(/(siparis|online.3d|uygun.fiyat|fiyat)/.test(path)){
      target='/hizmetler/3d-baski-siparisi/';
    }else if(/(prototip|numune|fonksiyonel)/.test(path)){
      target='/hizmetler/prototip-uretimi/';
    }else if(/(disli|cark|kirik|yedek|parca|aparat|maket)/.test(path)){
      target='/hizmetler/ozel-parca-uretimi/';
    }else if(/(modelleme|3d.tasarim|cizim|endustriyel.tasarim|cad)/.test(path)){
      target='/hizmetler/3d-tasarim/';
    }else if(/^\/blog\//.test(path)){
      target='/hizmetler/';
    }else if(/^\/bolge\//.test(path)){
      target='/hizmetler/3d-baski/';
    }else if(/^\/sayfa\//.test(path)){
      target=/(misyon|hakkimizda)/.test(path)?'/#hakkimizda':'/';
    }else{
      target='/hizmetler/';
    }
  }else if(/^\/(hakkimizda|misyonumuz)\/?$/.test(path)){
    target='/#hakkimizda';
  }else if(/^\/hizmetler?$/.test(path)){
    target='/hizmetler/';
  }
  if(target)location.replace(target);
})();
</script>
